# 注文の流れの台帳: 価格と関係なく、決まった理由で売買せざるを得ない相手の一覧。
# 戦略はチャートからではなく、ここから作る。すべて仮説で、書いた時点では根拠にならない。
#
# testable: ready（今のデータで確かめられる）/ partial（近似になる）/ blocked（needs のデータが要る）
# 検証の結果はここに書かない。lab.py flows が、カードと台帳から出す。

- id: F-000
  actor: 相手が説明できない案
  forced: なし
  when: なし
  expect: なし
  testable: ready
  note: 流れの台帳より前に作ったカード専用。新しいカードには使えない

- id: F-001
  actor: 仲値でドルを買う輸入企業
  forced: 決済のため、値を選ばず公示の時刻までに買う
  when: ゴトー日の 9:55 まで
  expect: 買いが止まる 9:55 のあと、USD/JPY が戻る
  testable: ready

- id: F-002
  actor: 週末に持ち越したくない短期の参加者
  forced: 週末の窓のリスクを避けるため、利益の出ている建玉も閉じる
  when: 金曜の NY 午後（日本時間 土曜の未明）
  expect: その週に動いた向きと逆に動く
  testable: ready

- id: F-003
  actor: スワップ目的の建玉を持つ参加者
  forced: 3日分のスワップを受け取ったあと、持つ理由がなくなる
  when: 3日分が付く日の翌朝
  expect: 高金利通貨が売られる
  testable: ready
  note: GMO で3日分が付く曜日は未確認。一般的な水曜の NY クローズで仮定した

- id: F-004
  actor: スプレッドの拡大で損切りにかかる個人
  forced: 早朝に BID と ASK が開き、損切りの注文が不利な値で約定する
  when: 日本時間 6:00〜8:30（USD/JPY の実測で約12銭に開く）
  expect: スプレッドが戻ったあと、動いた分が戻る
  testable: ready

- id: F-005
  actor: ロスカットされる個人
  forced: 証拠金が足りなくなり、成行で強制的に決済される
  when: 節目を割った直後
  expect: 連鎖して走ったあと、戻る
  testable: partial
  needs: 建玉の分布。今は節目の価格で近似するしかない

- id: F-006
  actor: 日本企業から配当を受け取る海外の株主
  forced: 円で受け取った配当を、値を選ばず自国の通貨に替える
  when: 期末配当は株主総会の集中日の翌日から、中間配当は12月上旬
  expect: その期間に円が売られ、USD/JPY が上がる
  testable: partial
  needs: 期末配当は総会の集中日で近似（東証の公表値）。中間配当の支払日は会社ごとで、12月上旬で近似した
  note: 投資信託の決算は分配金を円で払うので、向きが円買いになりうる。25日はゴトー日と重なり分けられないため、ここに含めない

- id: F-007
  actor: 為替介入を警戒する参加者
  forced: 介入を恐れて、特定の価格帯で買いを減らす
  when: 過去の介入の水準の近く
  expect: その価格帯で上値が重くなる
  testable: partial
  needs: 介入の日付と水準。回数が少ない

- id: F-008
  actor: 投資信託の積立（新 NISA など）を運用する会社
  forced: 月初に集まった積立の資金を、値を選ばず外貨に替える
  when: 月の2営業日目の東京時間
  expect: USD/JPY が買われる
  testable: ready
  note: 積立日の分布と為替を替える日は未確認。月初に集中すると仮定した

- id: F-009
  actor: ロンドン16時のフィキシングで約定する運用会社
  forced: 評価の基準になる公示の時刻に合わせて、値を選ばず売買する
  when: ロンドン 16:00 の前1時間に偏り、公示で止まる
  expect: 公示のあと、前1時間の動きが戻る
  testable: ready
