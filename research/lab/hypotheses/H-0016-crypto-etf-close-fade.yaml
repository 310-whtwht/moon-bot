why: 米国の現物 ETF の設定・解約が NY 16:00 の価格に合わせて売買され、その時刻を過ぎると偏りが止まる（r2。r1 は大きさの基準が厳しく取引が2〜29回で判定できなかった。基準は損益を見ずに、取引の回数だけで決め直した）
counterparty: 基準の時刻に合わせて値を選ばず売買する、ETF の設定・解約を受ける参加者
