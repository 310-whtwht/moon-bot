services:
  mysql:
    image: mysql:8.0
    container_name: moomoo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-moomoo_trading}
      MYSQL_USER: ${DB_USER:-moomoo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: moomoo_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: moomoo_api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-moomoo}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-moomoo_trading}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - PORT=8081
      - AUTO_MIGRATE=true
      - API_TOKEN=${API_TOKEN:?set API_TOKEN in .env}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      timeout: 30s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: moomoo_bot
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-moomoo}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-moomoo_trading}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Optional settings, taken from .env when present (see .env.example).
      - TRADER_ENABLED=${TRADER_ENABLED:-true}
      - TRADER_POLL_INTERVAL=${TRADER_POLL_INTERVAL:-30s}
      - TRADER_RECONCILE_INTERVAL=${TRADER_RECONCILE_INTERVAL:-5m}
      - PAPER_INITIAL_BALANCE=${PAPER_INITIAL_BALANCE:-30000}
      - RISK_ACCOUNT_MAX_UNITS=${RISK_ACCOUNT_MAX_UNITS:-1000}
      - RISK_ACCOUNT_MAX_POSITIONS=${RISK_ACCOUNT_MAX_POSITIONS:-3}
      - RISK_ACCOUNT_MAX_DAILY_LOSS=${RISK_ACCOUNT_MAX_DAILY_LOSS:-500}
      - RISK_ACCOUNT_MAX_WEEKLY_LOSS=${RISK_ACCOUNT_MAX_WEEKLY_LOSS:-1500}
      - RISK_GLOBAL_MAX_POSITIONS=${RISK_GLOBAL_MAX_POSITIONS:-5}
      - RISK_GLOBAL_MAX_DAILY_LOSS=${RISK_GLOBAL_MAX_DAILY_LOSS:-1000}
      - RISK_GLOBAL_MAX_WEEKLY_LOSS=${RISK_GLOBAL_MAX_WEEKLY_LOSS:-3000}
      - KILL_SWITCH=${KILL_SWITCH:-false}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # Real-money trading stays off unless every one of these is set.
      - BROKER_MODE=${BROKER_MODE:-paper}
      - LIVE_CONFIRM=${LIVE_CONFIRM:-}
      - GMO_API_KEY=${GMO_API_KEY:-}
      - GMO_API_SECRET=${GMO_API_SECRET:-}
      - GMO_ACCOUNT_ID=${GMO_ACCOUNT_ID:-default}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: moomoo_web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      - NEXT_PUBLIC_API_URL=http://localhost:8081
      # /api/v1/* is proxied by the web server to the API with this token.
      - API_URL=http://api:8081
      - API_TOKEN=${API_TOKEN:?set API_TOKEN in .env}
      - NEXTAUTH_URL_INTERNAL=http://moomoo_web:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      timeout: 30s
      retries: 3

volumes:
  mysql_data:
  redis_data: